[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bag2lerobot"
version = "0.1.0"
description = "Convert ROS 1/ROS 2 bags and MCAP recordings into LeRobot datasets for imitation learning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alejandro Torrico" }]
keywords = ["robotics", "ros", "ros2", "rosbag", "mcap", "lerobot", "imitation-learning", "dataset"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "rosbags>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
]

[project.optional-dependencies]
video = ["av>=11", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6", "av>=11", "pillow>=10"]

[project.scripts]
bag2lerobot = "bag2lerobot.cli:main"

[project.urls]
Repository = "https://github.com/alej96/rosbag-to-lerobot"

[tool.hatch.build.targets.wheel]
packages = ["src/bag2lerobot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["lerobot: needs the lerobot package installed (skipped otherwise)"]
